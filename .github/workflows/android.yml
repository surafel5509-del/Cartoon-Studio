name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: Run unit tests
        id: tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest test --stacktrace 2>&1 | tee -a build.log

      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifact storage is not reachable from every environment, so the
          # compiler output is mirrored into an issue where it can always be read.
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            grep -E "^(e:|w:|FAILURE|\* What went wrong|\* Where|Caused by|> )" build.log | head -300 || true
            echo '```'
            echo
            echo '<details><summary>Tail</summary>'
            echo
            echo '```'
            tail -c 30000 build.log
            echo '```'
            echo '</details>'
          } > report.md
          gh issue create \
            --title "CI failure ${{ github.sha }}" \
            --body-file report.md \
            --label "" || gh issue create \
            --title "CI failure ${{ github.sha }}" \
            --body-file report.md

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-studio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
